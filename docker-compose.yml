version: '3.8'

services:
  db:
    image: postgres:16.14
    container_name: ibb-postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: traffic_db
    ports:
      - "5432:5432"
    volumes:
      - ./ml/postgresql/data:/var/lib/postgresql/data

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: traffic-api
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/traffic_db
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=12345

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: traffic-frontend
    restart: always
    ports:
      - "4200:80" # Map the container's port 80 to the host's port 4200
    depends_on:
      - api